openapi: 3.1.0
info:
  title: DX-LAB Process Core (P) API
  version: 0.1.0
  description: >-
    Hợp đồng giao tiếp RESTful API chuẩn của dịch vụ lõi P cho các tác vụ
    tiếp nhận, điều phối và tra cứu quy trình nghiệp vụ số DX-OS.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://localhost:3000
    description: Cục bộ (Local Development)
  - url: http://p-process:3000
    description: Mạng nội bộ Docker Compose (application network)

paths:
  /health:
    get:
      summary: Kiểm tra trạng thái sẵn sàng của dịch vụ
      operationId: getHealth
      responses:
        '200':
          description: Dịch vụ đang hoạt động bình thường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/tickets:
    post:
      summary: Tiếp nhận yêu cầu mới (Ticket Intake)
      operationId: createTicket
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Khóa định danh thao tác duy nhất để chống lặp (AD-3)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '200':
          description: Phản hồi được phát lại từ một yêu cầu đã xử lý với cùng Idempotency-Key và payload
          headers:
            Idempotency-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '201':
          description: Tiếp nhận thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Idempotency-Key đã được dùng với payload khác
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Payload hoặc tệp đính kèm vượt giới hạn cho phép
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    get:
      summary: Tra cứu danh sách ticket
      operationId: listTickets
      security:
        - keycloakBearer: [tickets:read]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [WAITING, IN_PROGRESS, CLOSED]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Danh sách ticket
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternalTicketListItem'
                  total:
                    type: integer
        '400':
          description: Bộ lọc hoặc phân trang không hợp lệ
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401':
          description: Thiếu hoặc sai bearer token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '403':
          description: Token thiếu scope hoặc calling client không được tin cậy
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          description: Nhà cung cấp danh tính tạm thời không sẵn sàng
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/tickets/{ticketId}:
    get:
      summary: Tra cứu chi tiết ticket theo ID
      operationId: getTicketById
      security:
        - keycloakBearer: [tickets:read]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalTicketDetail'
        '401':
          description: Thiếu hoặc sai bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Token thiếu scope hoặc calling client không được tin cậy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Không tìm thấy ticket
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Nhà cung cấp danh tính tạm thời không sẵn sàng
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/tickets/{ticketId}/process:
    post:
      summary: Xử lý ticket theo quy trình và đóng sau khi hoàn tất
      operationId: processTicket
      security:
        - keycloakBearer: [tickets:write]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,200}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, action]
              properties:
                version: { type: integer, minimum: 1 }
                action: { enum: [start, start-step, complete-step, close] }
                stepId: { type: string }
                content: { type: string, minLength: 1, maxLength: 10000 }
                result: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '200':
          description: Lệnh commit hoặc replay, quyền được kiểm tra lại
          headers:
            Idempotency-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingState' }
        '401': { description: Token không hợp lệ }
        '403': { description: Thiếu scope, quyền nhóm hoặc không là người phụ trách }
        '404': { description: Không tìm thấy ticket }
        '409': { description: Version cũ hoặc cùng khóa khác nội dung; tải lại }
        '422': { description: Bước, thứ tự, nội dung hoặc kết quả không hợp lệ }
        '503': { description: Dịch vụ xác thực chưa sẵn sàng }

  /api/v1/public/tickets/{ticketId}/status:
    get:
      summary: Polling trạng thái công khai tối thiểu
      operationId: getPublicTicketStatus
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Trạng thái an toàn, không chứa PII hoặc liên kết tệp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicTicketStatus' }
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/v1/attachments/{attachmentId}/download:
    get:
      summary: Tải tệp sau khi kiểm tra quyền trên từng tài nguyên
      operationId: downloadTicketAttachment
      security:
        - keycloakBearer: [tickets:download]
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Nội dung tệp
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '401':
          description: Thiếu hoặc sai bearer token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '403':
          description: Token thiếu scope hoặc calling client không được tin cậy
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404':
          description: Không tồn tại hoặc ngoài phạm vi
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          description: Nhà cung cấp danh tính tạm thời không sẵn sàng
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

components:
  securitySchemes:
    keycloakBearer:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /realms/dxlab/protocol/openid-connect/auth
          tokenUrl: /realms/dxlab/protocol/openid-connect/token
          scopes:
            tickets:read: Đọc ticket theo phạm vi trách nhiệm
            tickets:download: Tải tệp của ticket được phép
            tickets:write: Xử lý ticket do mình phụ trách trong nhóm
  schemas:
    ProcessingState:
      type: object
      required: [status, version, workflow, calendar, steps, closedAt, result, slaDueAt, slaOverdue]
      properties:
        status: { enum: [WAITING, IN_PROGRESS, CLOSED] }
        version: { type: integer, minimum: 1 }
        workflow: { type: [object, 'null'] }
        calendar: { type: [object, 'null'] }
        steps: { type: array, items: { type: object } }
        closedAt: { type: [string, 'null'], format: date-time }
        result: { type: [string, 'null'] }
        slaDueAt: { type: [string, 'null'], format: date-time }
        slaOverdue: { type: boolean }
    PublicTicketStatus:
      type: object
      additionalProperties: false
      required: [id, code, status, confirmationEmailStatus]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [WAITING, IN_PROGRESS, CLOSED] }
        confirmationEmailStatus: { type: string, enum: [PENDING, PROCESSING, SENT, FAILED, DEAD_LETTER] }

    InternalTicketListItem:
      type: object
      additionalProperties: false
      required: [id, code, provisionalType, status, slaDueAt, summary]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        provisionalType: { type: string }
        status: { type: string, enum: [WAITING, IN_PROGRESS, CLOSED] }
        slaDueAt: { type: [string, 'null'], format: date-time }
        summary: { type: string }
        slaOverdue: { type: boolean }
        slaElapsedMinutes: { type: number }

    InternalTicketDetail:
      type: object
      additionalProperties: false
      required: [id, code, provisionalType, status, slaDueAt, summary, description, groupId, assignedToMe]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        provisionalType: { type: string }
        status: { type: string, enum: [WAITING, IN_PROGRESS, CLOSED] }
        slaDueAt: { type: [string, 'null'], format: date-time }
        summary: { type: string }
        description: { type: string }
        groupId: { type: string }
        assignedToMe: { type: boolean }
        slaOverdue: { type: boolean }
        slaElapsedMinutes: { type: number }
        version: { type: integer, minimum: 1 }
        workflow: { type: [object, 'null'] }
        steps: { type: array, items: { type: object } }
        closedAt: { type: [string, 'null'], format: date-time }
        result: { type: [string, 'null'] }
        allowedActions: { type: array, items: { enum: [start, start-step, complete-step, close] } }
        customer:
          type: object
          additionalProperties: false
          required: [name, phone, email]
          properties:
            name: { type: string }
            phone: { type: string }
            email: { type: string, format: email }
        attachment:
          $ref: '#/components/schemas/InternalTicketAttachment'

    InternalTicketAttachment:
      type: object
      additionalProperties: false
      required: [id, displayName, sizeBytes, detectedMime, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        sizeBytes: { type: integer, maximum: 10485760 }
        detectedMime: { type: string }
        createdAt: { type: string, format: date-time }
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
        - timestamp
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: p_process
        version:
          type: string
          example: 0.1.0
        timestamp:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Trường tiêu đề không được để trống
        instance:
          type: string
          example: /api/v1/tickets
        code:
          type: string
          example: validation_failed
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    TicketCreateRequest:
      type: object
      additionalProperties: false
      required:
        - customerName
        - customerPhone
        - customerEmail
        - provisionalType
        - description
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 120
        customerPhone:
          type: string
          minLength: 9
          maxLength: 24
        customerEmail:
          type: string
          format: email
        provisionalType:
          type: string
          enum: [Khiếu nại, Tư vấn, Bảo hành]
        description:
          type: string
          minLength: 10
          maxLength: 4000
        attachment:
          $ref: '#/components/schemas/AttachmentCreateRequest'

    AttachmentCreateRequest:
      type: object
      additionalProperties: false
      required: [fileName, mimeType, data]
      properties:
        fileName:
          type: string
          maxLength: 255
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
        data:
          type: string
          contentEncoding: base64
          maxLength: 13981016

    TicketAttachment:
      type: object
      additionalProperties: false
      required: [id, displayName, sizeBytes, detectedMime, checksumSha256, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        sizeBytes:
          type: integer
          maximum: 10485760
        detectedMime:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        createdAt:
          type: string
          format: date-time

    Ticket:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - description
        - status
        - customerId
        - provisionalType
        - customerEmail
        - customerPhone
        - customerName
        - contactReviewRequired
        - confirmationEmailStatus
        - receivedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: TCK-2026-0001
        description:
          type: string
        status:
          type: string
          enum: [WAITING, IN_PROGRESS, CLOSED]
        provisionalType:
          type: string
          enum: [Khiếu nại, Tư vấn, Bảo hành]
        customerId:
          type: string
          format: uuid
        confirmedType:
          type: string
        assignedStaffId:
          type: string
        customerEmail:
          type: string
          format: email
        customerPhone:
          type: string
        customerName:
          type: string
        contactReviewRequired:
          type: boolean
        confirmationEmailStatus:
          type: string
          enum: [PENDING, PROCESSING, SENT, FAILED, DEAD_LETTER]
        receivedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        attachment:
          $ref: '#/components/schemas/TicketAttachment'
