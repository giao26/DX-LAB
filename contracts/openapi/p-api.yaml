    ReportingMetricValue:
      type: object
      additionalProperties: false
      required: [value, unit, denominator]
      properties:
        value: { type: integer }
        unit: { type: string, example: ticket }
        denominator: { type: [integer, 'null'] }

    ReportingCsatMetric:
      type: object
      additionalProperties: false
      required: [rate_percent, response_count, average_score, unanswered_count]
      properties:
        rate_percent: { type: [number, 'null'], example: 87.5 }
        response_count: { type: integer, example: 8 }
        average_score: { type: [number, 'null'], example: 4.50 }
        unanswered_count: { type: integer, example: 1 }

    ReportingStepDuration:
      type: object
      additionalProperties: false
      required: [step_id, label, avg_duration_minutes]
      properties:
        step_id: { type: string, example: '1' }
        label: { type: string, example: Tiếp nhận sản phẩm }
        avg_duration_minutes: { type: number, example: 15.2 }

    ReportingMetricsResponse:
      type: object
      additionalProperties: false
      required:
        - definition_version
        - period
        - scope
        - kpis
        - step_durations
        - ticket_ids
      properties:
        definition_version:
          type: string
          example: 'v1.0'
        period:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        scope:
          type: object
          additionalProperties: false
          required: [role, groups]
          properties:
            role: { type: string }
            groups:
              type: array
              items: { type: string }
        kpis:
          type: object
          additionalProperties: false
          required:
            - new_tickets
            - backlog_tickets
            - closed_tickets
            - within_sla_tickets
            - overdue_sla_tickets
            - csat
          properties:
            new_tickets:
              $ref: '#/components/schemas/ReportingMetricValue'
            backlog_tickets:
              $ref: '#/components/schemas/ReportingMetricValue'
            closed_tickets:
              $ref: '#/components/schemas/ReportingMetricValue'
            within_sla_tickets:
              $ref: '#/components/schemas/ReportingMetricValue'
            overdue_sla_tickets:
              $ref: '#/components/schemas/ReportingMetricValue'
            csat:
              $ref: '#/components/schemas/ReportingCsatMetric'
        step_durations:
          type: array
          items:
            $ref: '#/components/schemas/ReportingStepDuration'
        ticket_ids:
          type: array
          items: { type: string, format: uuid }

    ReportingGrantRequest:
      type: object
      additionalProperties: false
      properties:
        groups:
          type: array
          items: { type: string }

    ReportingGrantResponse:
      type: object
      additionalProperties: false
      required: [grant_token, sub, roles, allowed_groups, expires_at, signature]
      properties:
        grant_token: { type: string }
        sub: { type: string }
        roles:
          type: array
          items: { type: string }
        allowed_groups:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
        signature: { type: string }

    CsatRatingCreateRequest:
      type: object
      additionalProperties: false
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          maxLength: 2000
          example: Dịch vụ rất tốt và nhanh chóng

    CsatRatingResponse:
      type: object
      additionalProperties: false
      required: [id, ticketId, score, comment, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        score: { type: integer }
        comment: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

