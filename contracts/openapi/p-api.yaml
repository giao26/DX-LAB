openapi: 3.1.0
info:
  title: DX-LAB Process Core (P) API
  version: 0.1.0
  description: >-
    Hợp đồng giao tiếp RESTful API chuẩn của dịch vụ lõi P cho các tác vụ
    tiếp nhận, điều phối và tra cứu quy trình nghiệp vụ số DX-OS.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://localhost:3000
    description: Cục bộ (Local Development)
  - url: http://p-process:3000
    description: Mạng nội bộ Docker Compose (application network)

paths:
  /health:
    get:
      summary: Kiểm tra trạng thái sẵn sàng của dịch vụ
      operationId: getHealth
      responses:
        '200':
          description: Dịch vụ đang hoạt động bình thường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/tickets:
    post:
      summary: Tiếp nhận yêu cầu mới (Ticket Intake)
      operationId: createTicket
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Khóa định danh thao tác duy nhất để chống lặp (AD-3)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/TicketCreateRequest'
                - type: object
                  properties:
                    attachment:
                      type: string
                      format: binary
                      description: Optional PDF, DOCX, XLSX, PNG, or JPEG attachment up to 10 MiB.
      responses:
        '200':
          description: Phản hồi được phát lại từ một yêu cầu đã xử lý với cùng Idempotency-Key và payload
          headers:
            Idempotency-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '201':
          description: Tiếp nhận thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Idempotency-Key đã được dùng với payload khác
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    get:
      summary: Tra cứu danh sách ticket
      operationId: listTickets
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [WAITING, IN_PROGRESS, CLOSED]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Danh sách ticket
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
                  total:
                    type: integer

  /api/v1/tickets/{ticketId}:
    get:
      summary: Tra cứu chi tiết ticket theo ID
      operationId: getTicketById
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Không tìm thấy ticket
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
        - timestamp
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: p_process
        version:
          type: string
          example: 0.1.0
        timestamp:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Trường tiêu đề không được để trống
        instance:
          type: string
          example: /api/v1/tickets
        code:
          type: string
          example: validation_failed
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    TicketCreateRequest:
      type: object
      additionalProperties: false
      required:
        - customerName
        - customerPhone
        - customerEmail
        - provisionalType
        - description
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 120
        customerPhone:
          type: string
          minLength: 9
          maxLength: 24
        customerEmail:
          type: string
          format: email
        provisionalType:
          type: string
          enum: [Khiếu nại, Tư vấn, Bảo hành]
        description:
          type: string
          minLength: 10
          maxLength: 4000

    Ticket:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - description
        - status
        - customerId
        - provisionalType
        - customerEmail
        - customerPhone
        - customerName
        - contactReviewRequired
        - receivedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: TCK-2026-0001
        description:
          type: string
        status:
          type: string
          enum: [WAITING, IN_PROGRESS, CLOSED]
        provisionalType:
          type: string
          enum: [Khiếu nại, Tư vấn, Bảo hành]
        customerId:
          type: string
          format: uuid
        confirmedType:
          type: string
        assignedStaffId:
          type: string
        customerEmail:
          type: string
          format: email
        customerPhone:
          type: string
        customerName:
          type: string
        contactReviewRequired:
          type: boolean
        receivedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
