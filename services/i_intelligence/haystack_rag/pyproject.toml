[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dxlab-haystack-rag"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "DX-LAB Intelligence Layer - Haystack RAG Service"
readme = "README.md"
authors = [{ name = "DX-LAB Development Team" }]
license = { text = "AGPL-3.0" }
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.28.0",
    "pydantic==2.6.4",
    "haystack-ai==3.1.1",
    "qdrant-haystack==10.5.0",
    "qdrant-client==1.19.1",
    "httpx==0.27.0",
    "psycopg2-binary==2.9.9",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.25.3"]
