name: DX-LAB CI Workflow

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Validate Code & Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Environment Template
        run: |
          cp .env.example .env
          echo "Checked .env file creation."

      - name: Validate Docker Compose Configuration
        run: |
          docker compose --profile core --profile demo --profile ai config > /dev/null
          echo "Docker compose configuration is valid across core, demo, and ai profiles."

      - name: Run Architecture Conformance Tests
        run: |
          python scripts/test-architecture.py

      - name: Run Intelligence Provider Unit Tests (Offline)
        env:
          AI_PROVIDER: fixture
        run: |
          python -m pip install uv==0.12.17
          uv lock --check --project services/i_intelligence/haystack_rag
          uv run --locked --project services/i_intelligence/haystack_rag --extra test python -m pytest services/i_intelligence/haystack_rag/tests tests/test_openrouter_architecture.py -q

      - name: Check License Headers in Python Files
        run: |
          echo "Checking copyright notices in Python scripts..."
          find . -name "*.py" -not -path "*/__pycache__/*" | while read file; do
            if ! grep -q "Copyright" "$file"; then
              echo "Warning: No Copyright header in $file"
            fi
          done

      - name: Lint Python Code
        run: |
          python -m compileall -q services/i_intelligence/haystack_rag/src
