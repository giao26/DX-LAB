name: DX-LAB CI Workflow

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Validate Code & Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            services/p_process/package-lock.json
            apps/web/package-lock.json

      - name: Check Environment Template
        run: |
          cp .env.example .env
          echo "Checked .env file creation."

      - name: Validate Docker Compose Configuration
        run: |
          docker compose --profile core --profile demo --profile ai config > /dev/null
          echo "Docker compose configuration is valid across core, demo, and ai profiles."

      - name: Run Architecture Conformance Tests
        run: |
          python scripts/test-architecture.py

      - name: Test Process Core
        run: |
          npm ci --prefix services/p_process
          npm test --prefix services/p_process

      - name: Test Ticket Integration with PostgreSQL
        run: |
          docker compose --profile core up -d --build postgres p-process
          for i in $(seq 1 30); do
            docker exec dxlab-p-process node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break
            sleep 1
          done
          docker exec dxlab-postgres createdb -U dxlab_admin dxlab_upgrade_test
          docker exec -i dxlab-postgres psql -v ON_ERROR_STOP=1 -U dxlab_admin -d dxlab_upgrade_test < services/p_process/src/adapters/postgres/migrations/0001_initial_technical_schema.sql
          docker exec -i dxlab-postgres psql -v ON_ERROR_STOP=1 -U dxlab_admin -d dxlab_upgrade_test < services/p_process/src/adapters/postgres/migrations/0002_ticket_intake.sql
          docker exec -i dxlab-postgres psql -v ON_ERROR_STOP=1 -U dxlab_admin -d dxlab_upgrade_test < services/p_process/src/adapters/postgres/migrations/0003_expand_ticket_status.sql
          docker exec -i dxlab-postgres psql -v ON_ERROR_STOP=1 -U dxlab_admin -d dxlab_upgrade_test < services/p_process/src/adapters/postgres/migrations/0004_ticket_notifications.sql
          docker exec -i dxlab-postgres psql -v ON_ERROR_STOP=1 -U dxlab_admin -d dxlab_upgrade_test < services/p_process/src/adapters/postgres/migrations/0005_private_ticket_attachments.sql
          docker exec -i dxlab-postgres psql -v ON_ERROR_STOP=1 -U dxlab_admin -d dxlab_upgrade_test < services/p_process/src/adapters/postgres/migrations/0006_ticket_access_scope.sql
          test "$(docker exec dxlab-postgres psql -U dxlab_admin -d dxlab_upgrade_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='dx_core' AND table_name IN ('customers','tickets','notifications','ticket_attachments')")" = "4"
          test "$(docker exec dxlab-postgres psql -U dxlab_admin -d dxlab_upgrade_test -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='dx_core' AND table_name='tickets' AND column_name IN ('group_id','assigned_sub')")" = "2"
          docker exec dxlab-p-process mkdir -p /app/test
          docker cp services/p_process/test/ticket-integration.mjs dxlab-p-process:/app/test/ticket-integration.mjs
          docker exec dxlab-p-process node /app/test/ticket-integration.mjs

      - name: Smoke test stock Keycloak runtime
        run: |
          docker compose --profile demo up -d --no-deps keycloak
          for i in $(seq 1 60); do
            docker exec dxlab-p-process node -e "fetch('http://keycloak:8080/realms/dxlab/.well-known/openid-configuration').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break
            sleep 2
          done
          docker cp services/p_process/test/keycloak-runtime-smoke.mjs dxlab-p-process:/app/test/keycloak-runtime-smoke.mjs
          docker exec dxlab-p-process node /app/test/keycloak-runtime-smoke.mjs

      - name: Test and Build Web BFF
        run: |
          npm ci --prefix apps/web
          npm test --prefix apps/web
          npm run test:e2e --prefix apps/web
          npm run build --prefix apps/web

      - name: Test Odoo ticket adapter
        run: |
          python -m unittest discover -s services/h_human/addons/dx_core/tests -p "test_*.py"
          python -m compileall -q services/h_human/addons/dx_core

      - name: Run Intelligence Provider Unit Tests (Offline)
        env:
          AI_PROVIDER: fixture
        run: |
          python -m pip install uv==0.12.17
          uv lock --check --project services/i_intelligence/haystack_rag
          uv run --locked --project services/i_intelligence/haystack_rag --extra test python -m pytest services/i_intelligence/haystack_rag/tests tests/test_openrouter_architecture.py -q

      - name: Check License Headers in Python Files
        run: |
          echo "Checking copyright notices in Python scripts..."
          find . -name "*.py" -not -path "*/__pycache__/*" | while read file; do
            if ! grep -q "Copyright" "$file"; then
              echo "Warning: No Copyright header in $file"
            fi
          done

      - name: Lint Python Code
        run: |
          python -m compileall -q services/i_intelligence/haystack_rag/src
