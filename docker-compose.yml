# ==============================================================================
# DX-LAB (DX-OS) Docker Compose Orchestration
# Olympic Tin học Sinh viên PMNM 2026 - Thể lệ PoF
#
# Layers:
#   - H: Human / Core ERP (Odoo)
#   - P: Process / Automation (Node-RED)
#   - D: Data & Analytics (PostgreSQL + Superset)
#   - I: Intelligence (Qdrant + Haystack + Ollama)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # TẦNG D: CƠ SỞ DỮ LIỆU CHUNG (PostgreSQL)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dxlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dxlab_db}
      POSTGRES_USER: ${POSTGRES_USER:-dxlab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxlab_postgres_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/d_data/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - dxlab-network

  # ----------------------------------------------------------------------------
  # TẦNG H: ERP & QUẢN TRỊ CON NGƯỜI (Odoo)
  # ----------------------------------------------------------------------------
  odoo:
    build:
      context: ./services/h_human
      dockerfile: Dockerfile
    container_name: dxlab-odoo
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      HOST: postgres
      PORT: 5432
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo_secure_password_2026}
    ports:
      - "${ODOO_PORT:-8069}:8069"
    volumes:
      - ./services/h_human/config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./services/h_human/addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
    networks:
      - dxlab-network

  # ----------------------------------------------------------------------------
  # TẦNG P: QUY TRÌNH & TỰ ĐỘNG HÓA (Node-RED)
  # ----------------------------------------------------------------------------
  node-red:
    build:
      context: ./services/p_process
      dockerfile: Dockerfile
    container_name: dxlab-node-red
    restart: unless-stopped
    ports:
      - "${NODE_RED_PORT:-1880}:1880"
    volumes:
      - ./services/p_process/data:/data
    networks:
      - dxlab-network

  # ----------------------------------------------------------------------------
  # TẦNG D: TRỰC QUAN HÓA & DỮ LIỆU (Apache Superset)
  # ----------------------------------------------------------------------------
  superset:
    build:
      context: ./services/d_data/superset
      dockerfile: Dockerfile
    container_name: dxlab-superset
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-superset-secret-key-production-change-2026}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-dxlab_admin}:${POSTGRES_PASSWORD:-dxlab_postgres_password_2026}@postgres:5432/${POSTGRES_DB:-dxlab_db}
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - ./services/d_data/superset/config/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    networks:
      - dxlab-network

  # ----------------------------------------------------------------------------
  # TẦNG I: CƠ SỞ DỮ LIỆU VECTOR (Qdrant)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: dxlab-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ./services/i_intelligence/qdrant/config/config.yaml:/qdrant/config/config.yaml:ro
      - qdrant_storage:/qdrant/storage
    networks:
      - dxlab-network

  # ----------------------------------------------------------------------------
  # TẦNG I: MÔ HÌNH NGÔN NGỮ CỤC BỘ (Ollama)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: dxlab-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - dxlab-network

  # ----------------------------------------------------------------------------
  # TẦNG I: TRÍ TUỆ NHÂN TẠO & RAG (Haystack RAG Service)
  # ----------------------------------------------------------------------------
  haystack-rag:
    build:
      context: ./services/i_intelligence/haystack_rag
      dockerfile: Dockerfile
    container_name: dxlab-haystack-rag
    restart: unless-stopped
    depends_on:
      - qdrant
      - ollama
      - postgres
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-dxlab_db}
    ports:
      - "${HAYSTACK_API_PORT:-8000}:8000"
    volumes:
      - ./services/i_intelligence/haystack_rag/src:/app/src
    networks:
      - dxlab-network

networks:
  dxlab-network:
    driver: bridge

volumes:
  postgres_data:
  odoo_data:
  superset_home:
  qdrant_storage:
  ollama_models:
