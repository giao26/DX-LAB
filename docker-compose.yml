# ==============================================================================
# DX-LAB (DX-OS) Docker Compose Orchestration
# Olympic Tin học Sinh viên PMNM 2026 - Thể lệ PoF
#
# Profiles:
#   - core: P (Fastify TypeScript) + PostgreSQL (lightweight development harness)
#   - demo: core + Caddy (single ingress) + Keycloak + Odoo + Node-RED + Superset + Mailpit
#   - ai: core + Qdrant + Haystack; OpenRouter is an external HTTPS dependency
#
# Networks (AD-11):
#   - public-net: Caddy ingress only (ports 80, 443)
#   - app-net: Internal application communication (P, Odoo, Node-RED, Keycloak, Superset, Mailpit)
#   - data-net: Private database and AI vector storage (PostgreSQL, Qdrant)
#
# Copyright (C) 2026 DX-LAB Development Team
# License: AGPL-3.0
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # TẦNG D: CƠ SỞ DỮ LIỆU CHUNG (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dxlab-postgres
    restart: unless-stopped
    profiles:
      - core
      - demo
      - ai
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dxlab_db}
      POSTGRES_USER: ${POSTGRES_USER:-dxlab_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxlab_postgres_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/d_data/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - data-net

  # ----------------------------------------------------------------------------
  # TẦNG P: LÕI TIẾN TRÌNH & NGHIỆP VỤ (Fastify TypeScript - Hexagonal Core)
  # ----------------------------------------------------------------------------
  p-process:
    build:
      context: ./services/p_process
      dockerfile: Dockerfile
    container_name: dxlab-p-process
    restart: unless-stopped
    profiles:
      - core
      - demo
      - ai
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dxlab_admin}:${POSTGRES_PASSWORD:-dxlab_postgres_password_2026}@postgres:5432/${POSTGRES_DB:-dxlab_db}
      MIGRATIONS_DIR: /app/migrations
    networks:
      - app-net
      - data-net

  # ----------------------------------------------------------------------------
  # TẦNG WEB: DX-PORTAL / BIỂU MẪU VÀ BFF (Next.js)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: dxlab-web
    restart: unless-stopped
    profiles:
      - demo
    depends_on:
      - p-process
    environment:
      P_PROCESS_BASE_URL: http://p-process:3000
    networks:
      - app-net

  # ----------------------------------------------------------------------------
  # CỔNG VÀO CÔNG KHAI DUY NHẤT (Caddy Reverse Proxy - AD-11)
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2.11.4-alpine
    container_name: dxlab-caddy
    restart: unless-stopped
    profiles:
      - demo
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public-net
      - app-net
    depends_on:
      - web
      - p-process
      - odoo
      - keycloak
      - superset

  # ----------------------------------------------------------------------------
  # TẦNG QUẢN LÝ ĐỊNH DANH TẬP TRUNG (Keycloak OIDC - AD-5)
  # ----------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: dxlab-keycloak
    restart: unless-stopped
    profiles:
      - demo
    command: start-dev
    depends_on:
      - postgres
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dxlab_keycloak_admin_2026}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-dxlab_keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-dxlab_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dxlab_postgres_password_2026}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    networks:
      - app-net
      - data-net

  # ----------------------------------------------------------------------------
  # TẦNG H: ERP & QUẢN TRỊ CON NGƯỜI (Odoo 17 Community)
  # ----------------------------------------------------------------------------
  odoo:
    build:
      context: ./services/h_human
      dockerfile: Dockerfile
    container_name: dxlab-odoo
    restart: unless-stopped
    profiles:
      - demo
    depends_on:
      - postgres
    environment:
      HOST: postgres
      PORT: 5432
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo_secure_password_2026}
    volumes:
      - ./services/h_human/config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./services/h_human/addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
    networks:
      - app-net
      - data-net

  # ----------------------------------------------------------------------------
  # TẦNG P: LẬP LỊCH & CHUYỂN GIAO TÍCH HỢP (Node-RED 5)
  # ----------------------------------------------------------------------------
  node-red:
    build:
      context: ./services/p_automation
      dockerfile: Dockerfile
    container_name: dxlab-node-red
    restart: unless-stopped
    profiles:
      - demo
    volumes:
      - ./services/p_automation/data:/data
    networks:
      - app-net

  # ----------------------------------------------------------------------------
  # TẦNG D: TRỰC QUAN HÓA & BÁO CÁO (Apache Superset 6)
  # ----------------------------------------------------------------------------
  superset:
    build:
      context: ./services/d_data/superset
      dockerfile: Dockerfile
    container_name: dxlab-superset
    restart: unless-stopped
    profiles:
      - demo
    depends_on:
      - postgres
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-superset-secret-key-production-change-2026}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-dxlab_admin}:${POSTGRES_PASSWORD:-dxlab_postgres_password_2026}@postgres:5432/${POSTGRES_DB:-dxlab_db}
    volumes:
      - ./services/d_data/superset/config/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    networks:
      - app-net
      - data-net

  # ----------------------------------------------------------------------------
  # TEST DOUBLES: HỘP THƯ KIỂM THỬ NỘI BỘ (Mailpit)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: dxlab-mailpit
    restart: unless-stopped
    profiles:
      - core
      - demo
    volumes:
      - mailpit_data:/data
    networks:
      - app-net

  # ----------------------------------------------------------------------------
  # TẦNG I: CƠ SỞ DỮ LIỆU VECTOR (Qdrant 1.19.1)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: dxlab-qdrant
    restart: unless-stopped
    profiles:
      - ai
    volumes:
      - ./services/i_intelligence/qdrant/config/config.yaml:/qdrant/config/config.yaml:ro
      - qdrant_storage:/qdrant/storage
    networks:
      - data-net

  # ----------------------------------------------------------------------------
  # TẦNG I: TRÍ TUỆ NHÂN TẠO & RAG (Haystack RAG Service)
  # ----------------------------------------------------------------------------
  haystack-rag:
    build:
      context: ./services/i_intelligence/haystack_rag
      dockerfile: Dockerfile
    container_name: dxlab-haystack-rag
    restart: unless-stopped
    profiles:
      - ai
    depends_on:
      - qdrant
      - postgres
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-30}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-dxlab_db}
    volumes:
      - ./services/i_intelligence/haystack_rag/src:/app/src
    networks:
      - app-net
      - data-net

networks:
  public-net:
    driver: bridge
  app-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  postgres_data:
  odoo_data:
  superset_home:
  qdrant_storage:
  caddy_data:
  caddy_config:
  mailpit_data:
